<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Auto Filler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 28px;
            color: #333;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .stat-card .label {
            color: #999;
            font-size: 14px;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .urls-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .url-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .url-text {
            color: #333;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-captcha {
            background: #f8d7da;
            color: #842029;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Contact Form Auto Filler</h1>
            <p>Automated Contact Form Submission Dashboard</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="label">Total Websites</div>
                <div class="number" id="total">-</div>
            </div>
            <div class="stat-card">
                <div class="label">✓ Completed</div>
                <div class="number" id="completed">-</div>
            </div>
            <div class="stat-card">
                <div class="label">⚠ CAPTCHA</div>
                <div class="number" id="captcha">-</div>
            </div>
            <div class="stat-card">
                <div class="label">↻ In Progress</div>
                <div class="number" id="in_progress">-</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="urlInput" placeholder="Enter website URL" style="flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
            <button class="btn btn-primary" onclick="addWebsite()">+ Add Website</button>
            <button class="btn btn-secondary" onclick="loadData()">Refresh</button>
            <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
        </div>

        <div class="urls-container">
            <div id="urlsList"></div>
        </div>
    </div>

    <script>
        let allUrls = [];

        // Load data immediately
        window.addEventListener('load', () => {
            loadData();
            setInterval(loadData, 2000);
        });

        function loadData() {
            console.log('Loading data...');
            
            // Load stats
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    console.log('Stats:', data);
                    document.getElementById('total').textContent = data.total_websites || 0;
                    document.getElementById('completed').textContent = data.completed || 0;
                    document.getElementById('captcha').textContent = data.captcha || 0;
                    document.getElementById('in_progress').textContent = data.in_progress || 0;
                })
                .catch(e => console.error('Stats error:', e));

            // Load URLs
            fetch('/api/urls?limit=1000')
                .then(r => r.json())
                .then(data => {
                    console.log('URLs:', data);
                    allUrls = data.urls || [];
                    displayUrls(allUrls);
                })
                .catch(e => console.error('URLs error:', e));
        }

        function displayUrls(urls) {
            const container = document.getElementById('urlsList');
            
            if (!urls || urls.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>No websites yet</h2></div>';
                return;
            }

            let html = '';
            urls.forEach(item => {
                const statusClass = `status-${item.status || 'pending'}`;
                html += `
                    <div class="url-item">
                        <div class="url-text">${item.url}</div>
                        <span class="status-badge ${statusClass}">${item.status || 'pending'}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function addWebsite() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert('Enter a URL');
                return;
            }

            fetch(`/api/urls/add?url=${encodeURIComponent(url)}`, {method: 'POST'})
                .then(r => r.json())
                .then(() => {
                    document.getElementById('urlInput').value = '';
                    loadData();
                })
                .catch(e => alert('Error: ' + e));
        }

        function clearAll() {
            if (!confirm('Delete all URLs?')) return;
            fetch('/api/urls/clear')
                .then(() => loadData())
                .catch(e => alert('Error: ' + e));
        }
    </script>
</body>
</html>
